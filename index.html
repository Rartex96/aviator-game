<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Sky Trading Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;900&display=swap');
        
        * { box-sizing: border-box; }
        html, body { 
            font-family: 'Poppins', sans-serif; 
            background: #090d16; 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: 0; 
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .hidden { display: none !important; }

        #app-wrapper {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        #game-canvas-container {
            width: 100%;
            height: 22vh;
            position: relative;
            background: #030712;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            flex-shrink: 0;
            cursor: pointer;
        }

        #multiplier-overlay {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.1rem;
            font-weight: 900;
            color: #34d399;
            background: rgba(3, 7, 18, 0.8);
            padding: 3px 10px;
            border-radius: 6px;
            border: 1px solid rgba(52, 211, 153, 0.3);
            pointer-events: none;
            z-index: 10;
        }

        #top-notification {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 0.8rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(3, 7, 18, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        #timer-overlay {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 0.85rem;
            font-weight: 900;
            color: #f59e0b;
            background: rgba(3, 7, 18, 0.85);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(245, 158, 11, 0.3);
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        #ui-overlay {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 6px;
            padding: 8px 12px 16px 12px;
            background: #111827;
            border-top: 2px solid #1f2937;
            width: 100%;
            overflow-y: auto;
        }

        .card { 
            background: #1f2937; 
            padding: 8px 12px; 
            border-radius: 10px; 
            box-shadow: 0 3px 10px rgba(0,0,0,0.4); 
            flex-shrink: 0;
            border: 1px solid #374151;
        }
        
        .hud-row { display: flex; justify-content: space-between; align-items: center; }

        button { 
            border-radius: 8px; 
            border: none; 
            font-weight: 800; 
            cursor: pointer; 
            font-family: 'Poppins', sans-serif; 
            text-transform: uppercase;
            transition: all 0.15s ease;
        }
        button:active { transform: scale(0.97); }

        .btn-primary { background: #f59e0b; color: #111; width: 100%; font-size: 0.9rem; padding: 10px; }
        .btn-secondary { background: #4f46e5; color: #fff; font-size: 0.7rem; padding: 6px 10px; }
        .btn-withdraw { background: #ef4444; color: #fff; width: 100%; font-size: 0.75rem; padding: 6px; margin-top: 4px; }
        
        .trade-controls { display: flex; gap: 10px; }
        .trade-btn-buy { background: linear-gradient(135deg, #10b981, #059669); color: white; flex: 1; font-size: 1rem; padding: 12px 0; border-radius: 8px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); }
        .trade-btn-sell { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; flex: 1; font-size: 1rem; padding: 12px 0; border-radius: 8px; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }

        #auth-section { margin: auto; background: #1f2937; padding: 25px; border-radius: 16px; width: 90%; max-width: 360px; border: 1px solid #374151; box-shadow: 0 8px 25px rgba(0,0,0,0.6); }
        .auth-tabs { display: flex; margin-bottom: 15px; background: #111827; border-radius: 8px; padding: 4px; }
        .auth-tab { flex: 1; background: transparent; color: #9ca3af; padding: 8px; border-radius: 6px; font-size: 0.85rem; }
        .auth-tab.active { background: #4f46e5; color: #fff; }

        input { width: 100%; padding: 8px; margin-bottom: 6px; border-radius: 6px; border: 1px solid #4b5563; background: #374151; color: #fff; font-size: 0.8rem; }
        #trade-status { font-weight: 700; min-height: 18px; font-size: 0.75rem; margin: 6px 0 0 0; color: #34d399; }
        
        .action-row { display: flex; gap: 8px; }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <!-- AUTH SECTION -->
        <div id="auth-section">
            <h2 style="margin-bottom: 4px; color: #f59e0b; font-size: 1.6rem;">✈️ Aviator Sky</h2>
            <p style="color:#9ca3af; font-size:0.8rem; margin-bottom: 15px;">Continuous Flight & Horizontal Reference Line Trading</p>
            
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Login</button>
                <button class="auth-tab" id="tab-signup" onclick="switchAuthTab('signup')">Sign Up</button>
            </div>

            <input type="tel" id="phone" placeholder="Phone Number (10 digits)" maxlength="10">
            <input type="password" id="password" placeholder="Account Password">
            <button class="btn-primary" id="auth-btn" onclick="handleAuth()">Login to Account</button>
        </div>

        <!-- MAIN GAME DASHBOARD -->
        <div id="game-section" class="hidden" style="display:flex; flex-direction:column; width:100%; height:100%;">
            <div id="game-canvas-container">
                <div id="top-notification"></div>
                <div id="multiplier-overlay">1.00X</div>
                <div id="timer-overlay">⏱️ 5s</div>
                <canvas id="pixi-canvas"></canvas>
            </div>

            <div id="ui-overlay">
                <!-- TOP HUD & SWITCH MODE ROW -->
                <div class="hud-row card">
                    <div style="text-align: left;">
                        <div style="color: #9ca3af; font-size: 0.55rem;">Wallet Balance</div>
                        <div style="font-size: 1rem; font-weight: 900;">₹<span id="balance-display">10000</span></div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span id="mode-display" style="background: #374151; padding: 3px 8px; border-radius: 4px; color: #60a5fa; font-size: 0.65rem; font-weight: 800;">DEMO</span>
                        <button class="btn-secondary" onclick="switchMode()">Switch Mode</button>
                    </div>
                </div>
                
                <!-- REAL-MODE ONLY ACTION ROW -->
                <div id="real-actions-container" class="action-row hidden">
                     <button id="deposit-toggle-btn" class="btn-secondary" style="flex:1; background:#10b981;" onclick="togglePanel('deposit-panel')">Deposit (₹200)</button>
                     <button id="withdraw-toggle-btn" class="btn-secondary" style="flex:1;" onclick="togglePanel('withdraw-panel')">Withdraw</button>
                </div>

                <!-- DEPOSIT PANEL -->
                <div id="deposit-panel" class="card hidden" style="border: 1px dashed #10b981; text-align: center;">
                    <h4 style="margin: 0 0 4px 0; color: #10b981; font-size: 0.75rem;">Instant UPI QR Scanner (₹200)</h4>
                    <div style="background:#fff; padding:3px; display:inline-block; border-radius:4px;">
                        <img id="qr-code-img" alt="UPI QR" style="width:90px; height:90px; display:block;" />
                    </div>
                    <p style="font-size:0.65rem; color:#9ca3af; margin:3px 0 0 0;">Scan with GPay/PhonePe to credit real funds</p>
                </div>

                <!-- WITHDRAW PANEL -->
                <div id="withdraw-panel" class="card hidden" style="border: 1px dashed #ef4444;">
                    <h4 style="margin: 0 0 4px 0; color: #ef4444; font-size: 0.75rem;">Withdraw Funds (Min ₹200)</h4>
                    <input type="number" id="withdraw-amt" placeholder="Enter amount (Min 200)">
                    <input type="text" id="withdraw-upi" placeholder="Enter UPI ID (e.g. name@paytm)">
                    <button class="btn-withdraw" onclick="requestWithdrawal()">Submit Withdrawal</button>
                </div>

                <!-- BUY & SELL CONTROLS SECTION -->
                <div class="card">
                    <div class="trade-controls">
                        <button class="trade-btn-buy" onclick="handleBuy()">BUY (₹50)</button>
                        <button class="trade-btn-sell" onclick="handleSell()">SELL</button>
                    </div>
                    <p id="trade-status">Ready! Click BUY/SELL or tap canvas to set position.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isDemoMode = true;
        let demoBalance = 10000;
        let realBalance = 0;
        let authMode = 'login';
        const TRADE_FEE_OR_AMOUNT = 50; 
        const MERCHANT_UPI_VPA = "9685008188-4@ybl"; 

        let activeTradePlaced = false;
        let currentMultiplier = 1.0;
        let flightTime = 0;
        let tradeTimerInterval = null;
        let activeTradeType = null; // 'BUY' or 'SELL'
        let customEntryY = null;    // Canvas Y coordinate for reference line

        function switchAuthTab(mode) {
            authMode = mode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
            document.getElementById('auth-btn').innerText = mode === 'login' ? "Login to Account" : "Create Account & Sign Up";
        }

        function handleAuth() {
            const phone = document.getElementById('phone').value;
            const pass = document.getElementById('password').value;
            if(phone.length === 10 && pass.length > 0) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('game-section').classList.remove('hidden');
                initPixiGraphics();
                updateUI();
            } else {
                showCustomMessage("Please enter a valid 10-digit phone number and password.");
            }
        }

        function updateUI() {
            document.getElementById('balance-display').innerText = isDemoMode ? demoBalance : realBalance;
            const modeEl = document.getElementById('mode-display');
            const realActionsEl = document.getElementById('real-actions-container');

            if (isDemoMode) {
                modeEl.innerText = "DEMO";
                modeEl.style.color = "#60a5fa";
                realActionsEl.classList.add('hidden');
                document.getElementById('deposit-panel').classList.add('hidden');
                document.getElementById('withdraw-panel').classList.add('hidden');
            } else {
                modeEl.innerText = "REAL";
                modeEl.style.color = "#10b981";
                realActionsEl.classList.remove('hidden');
            }
        }

        function switchMode() {
            isDemoMode = !isDemoMode;
            updateUI();
            if(!isDemoMode) {
                togglePanel('deposit-panel', true);
            }
        }

        function togglePanel(panelId, forceOpen = false) {
            if(isDemoMode && panelId === 'deposit-panel') return;
            const depositPanel = document.getElementById('deposit-panel');
            const withdrawPanel = document.getElementById('withdraw-panel');
            
            const isDepHidden = depositPanel.classList.contains('hidden');
            const isWdHidden = withdrawPanel.classList.contains('hidden');
            
            depositPanel.classList.add('hidden');
            withdrawPanel.classList.add('hidden');
            
            if(panelId === 'deposit-panel' && (isDepHidden || forceOpen)) {
                depositPanel.classList.remove('hidden');
                const upiDeepLink = `upi://pay?pa=${MERCHANT_UPI_VPA}&pn=AviatorSky&am=200&cu=INR`;
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(upiDeepLink)}`;
                document.getElementById('qr-code-img').src = qrUrl;
            } else if(panelId === 'withdraw-panel' && isWdHidden) {
                withdrawPanel.classList.remove('hidden');
            }
        }

        function requestWithdrawal() {
            const amt = parseInt(document.getElementById('withdraw-amt').value);
            const upiId = document.getElementById('withdraw-upi').value.trim();

            if(isNaN(amt) || amt < 200) {
                showCustomMessage("Minimum withdrawal amount is ₹200!");
                return;
            }
            if(amt > realBalance) {
                showCustomMessage("Insufficient real wallet balance!");
                return;
            }
            if(!upiId || !upiId.includes('@')) {
                showCustomMessage("Please enter a valid UPI ID (e.g., name@paytm)!");
                return;
            }

            realBalance -= amt;
            updateUI();
            showCustomMessage(`Withdrawal of ₹${amt} to '${upiId}' requested successfully!`);
            togglePanel('');
        }

        function showCustomMessage(msg) {
            document.getElementById('trade-status').innerText = msg;
        }

        function showTopNotification(text, isWin) {
            const notif = document.getElementById('top-notification');
            notif.innerText = text;
            notif.style.color = isWin ? "#34d399" : "#ef4444";
            notif.style.borderColor = isWin ? "rgba(52, 211, 153, 0.4)" : "rgba(239, 68, 68, 0.4)";
            notif.style.display = 'block';
            
            setTimeout(() => {
                notif.style.display = 'none';
            }, 4000);
        }

        // --- PixiJS Graph Flight Engine & Reference Line ---
        let app, mainPlane, skyContainer, tinyClouds = [], trailGraphics, refLineGraphics;
        let flightHistoryPoints = [];
        let targetOffsetY = 0;
        let currentOffsetY = 0;
        let nextRandomTimer = 0;

        function initPixiGraphics() {
            const container = document.getElementById('game-canvas-container');
            app = new PIXI.Application({
                view: document.getElementById('pixi-canvas'),
                width: container.clientWidth,
                height: container.clientHeight,
                backgroundColor: 0x030712,
                resolution: window.devicePixelRatio || 1
            });

            skyContainer = new PIXI.Container();
            app.stage.addChild(skyContainer);

            const bg = new PIXI.Graphics();
            bg.beginFill(0x0f172a);
            bg.drawRect(0, 0, app.screen.width, app.screen.height);
            bg.endFill();
            skyContainer.addChild(bg);

            for(let i=0; i<6; i++) {
                createTinyCloud(Math.random() * app.screen.width * 2, Math.random() * (app.screen.height - 20) + 10);
            }

            trailGraphics = new PIXI.Graphics();
            skyContainer.addChild(trailGraphics);

            refLineGraphics = new PIXI.Graphics();
            skyContainer.addChild(refLineGraphics);

            // Aeroplane Sprite creation
            const planeGfx = new PIXI.Graphics();
            planeGfx.beginFill(0xf59e0b); 
            planeGfx.drawRoundedRect(-14, -4, 32, 10, 2);
            planeGfx.endFill();
            planeGfx.beginFill(0xf8fafc); 
            planeGfx.moveTo(-2, -2); planeGfx.lineTo(6, -14); planeGfx.lineTo(12, -2);
            planeGfx.moveTo(-2, 2); planeGfx.lineTo(6, 14); planeGfx.lineTo(12, 2);
            planeGfx.endFill();
            planeGfx.beginFill(0xef4444); 
            planeGfx.moveTo(-12, -4); planeGfx.lineTo(-18, -10); planeGfx.lineTo(-6, -4);
            planeGfx.endFill();

            mainPlane = new PIXI.Container();
            mainPlane.addChild(planeGfx);
            mainPlane.x = app.screen.width * 0.3;
            mainPlane.y = app.screen.height * 0.5;
            mainPlane.scale.set(0.42);
            mainPlane.rotation = 0;

            skyContainer.addChild(mainPlane);

            // Allow clicking on canvas to set horizontal entry line position
            container.addEventListener('click', (e) => {
                const rect = container.getBoundingClientRect();
                const clickY = e.clientY - rect.top;
                customEntryY = clickY;
                if(activeTradePlaced) {
                    showCustomMessage(`Reference Line updated to Y: ${Math.round(customEntryY)}px`);
                }
            });

            app.ticker.add(slowRandomGraphFlightTicker);
        }

        function createTinyCloud(x, y) {
            const cloud = new PIXI.Graphics();
            cloud.beginFill(0xffffff, 0.18);
            cloud.drawCircle(0, 0, 3);
            cloud.drawCircle(5, -2, 5);
            cloud.drawCircle(10, 0, 3);
            cloud.endFill();
            cloud.x = x;
            cloud.y = y;
            skyContainer.addChild(cloud);
            tinyClouds.push(cloud);
        }

        function slowRandomGraphFlightTicker() {
            flightTime += 0.015;

            tinyClouds.forEach(c => {
                c.x -= 0.8;
                if(c.x < -30) c.x = app.screen.width + 30;
            });

            nextRandomTimer--;
            if (nextRandomTimer <= 0) {
                nextRandomTimer = 70 + Math.floor(Math.random() * 60);
                targetOffsetY = (Math.random() * 35) - 17; 
            }

            currentOffsetY += (targetOffsetY - currentOffsetY) * 0.03;
            const baseY = app.screen.height * 0.55;
            mainPlane.y = baseY + currentOffsetY;
            mainPlane.rotation = (targetOffsetY - currentOffsetY) * 0.015;

            currentMultiplier = (1.0 + (flightTime * 0.08)).toFixed(2);
            document.getElementById('multiplier-overlay').innerText = currentMultiplier + "X";

            flightHistoryPoints.push({ x: mainPlane.x, y: mainPlane.y });
            if (flightHistoryPoints.length > 90) {
                flightHistoryPoints.shift();
            }

            trailGraphics.clear();
            if (flightHistoryPoints.length > 2) {
                trailGraphics.lineStyle(5, 0x10b981, 0.3);
                trailGraphics.moveTo(flightHistoryPoints[0].x, flightHistoryPoints[0].y);
                for(let pt of flightHistoryPoints) {
                    trailGraphics.lineTo(pt.x, pt.y);
                }

                trailGraphics.lineStyle(2, 0x34d399, 1);
                trailGraphics.moveTo(flightHistoryPoints[0].x, flightHistoryPoints[0].y);
                for(let pt of flightHistoryPoints) {
                    trailGraphics.lineTo(pt.x, pt.y);
                }
            }

            // Render Horizontal Reference Line if trade is active
            refLineGraphics.clear();
            if (activeTradePlaced && customEntryY !== null) {
                const lineColor = activeTradeType === 'BUY' ? 0x10b981 : 0xef4444;
                refLineGraphics.lineStyle(2, lineColor, 0.8);
                refLineGraphics.moveTo(0, customEntryY);
                refLineGraphics.lineTo(app.screen.width, customEntryY);
            }
        }

        function handleBuy() {
            startTradeSession("BUY");
        }

        function handleSell() {
            startTradeSession("SELL");
        }

        function startTradeSession(type) {
            if(activeTradePlaced) return;
            let activeBal = isDemoMode ? demoBalance : realBalance;

            if(activeBal < TRADE_FEE_OR_AMOUNT) {
                showCustomMessage(`Insufficient balance for ${type} (₹50 fee)!`);
                return;
            }

            if(isDemoMode) demoBalance -= TRADE_FEE_OR_AMOUNT;
            else realBalance -= TRADE_FEE_OR_AMOUNT;
            updateUI();

            activeTradePlaced = true;
            activeTradeType = type;
            // Default reference line to current plane Y if not clicked on canvas yet
            if(customEntryY === null) {
                customEntryY = mainPlane.y;
            }

            showCustomMessage(`📈 ${type} position placed! Reference line set. Waiting 5s...`);

            let secondsLeft = 5;
            const timerEl = document.getElementById('timer-overlay');
            timerEl.innerText = `⏱️ ${secondsLeft}s`;
            timerEl.style.display = 'block';

            if(tradeTimerInterval) clearInterval(tradeTimerInterval);

            tradeTimerInterval = setInterval(() => {
                secondsLeft--;
                if(secondsLeft > 0) {
                    timerEl.innerText = `⏱️ ${secondsLeft}s`;
                } else {
                    clearInterval(tradeTimerInterval);
                    timerEl.style.display = 'none';

                    // Evaluate outcome comparing final plane Y vs reference line Y
                    evaluateTradeOutcome();
                    activeTradePlaced = false;
                    customEntryY = null;
                }
            }, 1000);
        }

        function evaluateTradeOutcome() {
            const finalPlaneY = mainPlane.y;
            const diff = finalPlaneY - customEntryY; // Pixel difference

            // Small epsilon threshold (e.g. 1.5 pixels) to account for exact draw / flat stabilization
            const EPSILON = 1.5;

            let isWin = false;
            let isDraw = false;

            if (Math.abs(diff) <= EPSILON) {
                isDraw = true;
            } else if (activeTradeType === 'BUY') {
                // BUY wins if plane goes upwards (Y is smaller on screen coordinates)
                isWin = finalPlaneY < customEntryY;
            } else {
                // SELL wins if plane goes downwards (Y is larger on screen coordinates)
                isWin = finalPlaneY > customEntryY;
            }

            if (isDraw) {
                if(isDemoMode) demoBalance += TRADE_FEE_OR_AMOUNT;
                else realBalance += TRADE_FEE_OR_AMOUNT;
                updateUI();
                showTopNotification(`🤝 Draw! Stake ₹50 Refunded`, true);
                showCustomMessage(`Match drawn. Stake refunded.`);
            } else if (isWin) {
                const payout = 100;
                if(isDemoMode) demoBalance += payout;
                else realBalance += payout;
                updateUI();
                showTopNotification(`✨ Successfully Won ₹${payout}!`, true);
                showCustomMessage(`Success! Won ₹${payout}.`);
            } else {
                updateUI();
                showTopNotification(`💥 Successfully Lost ₹${TRADE_FEE_OR_AMOUNT}!`, false);
                showCustomMessage(`Market moved against position! Lost ₹${TRADE_FEE_OR_AMOUNT}.`);
            }
        }
    </script>
</body>
</html>
