<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Sky Crash</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap');
        
        * { box-sizing: border-box; }
        html, body { 
            font-family: 'Poppins', sans-serif; 
            background: #0f172a; 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: 0; 
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }

        .hidden { display: none !important; }

        #app-wrapper {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
        }

        #game-canvas-container {
            width: 100%;
            height: 35vh;
            position: relative;
            background: #020617;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            flex-shrink: 0;
        }

        #multiplier-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            pointer-events: none;
            text-shadow: 0 4px 12px rgba(0,0,0,0.9), 0 0 25px rgba(255,215,0,0.6);
            z-index: 10;
        }

        #ui-overlay {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px 10px;
            background: #111827;
            border-top: 2px solid #374151;
            overflow-y: auto;
            width: 100%;
            -webkit-overflow-scrolling: touch;
        }

        .card { 
            background: #1f2937; 
            padding: 8px 10px; 
            border-radius: 8px; 
            margin-bottom: 6px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.3); 
        }
        
        .hud-row { display: flex; justify-content: space-between; align-items: center; }

        button { 
            border-radius: 8px; 
            border: none; 
            font-weight: 800; 
            cursor: pointer; 
            font-family: 'Poppins', sans-serif; 
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        button:active { transform: scale(0.96); }

        .btn-primary { background: #f59e0b; color: #111; width: 100%; font-size: 1rem; padding: 12px; }
        .btn-secondary { background: #4f46e5; color: #fff; font-size: 0.75rem; padding: 8px 10px; }
        .btn-deposit-action { background: #10b981; color: #fff; width: 100%; font-size: 0.8rem; padding: 8px; margin-top: 4px; }
        .btn-withdraw { background: #ef4444; color: #fff; width: 100%; font-size: 0.8rem; padding: 8px; margin-top: 4px; }
        
        .bet-controls { display: flex; justify-content: center; gap: 6px; }
        .bet-btn { background: #3b82f6; color: white; width: 32%; font-size: 0.95rem; padding: 10px 0; border-radius: 8px; box-shadow: 0 3px 10px rgba(59, 130, 246, 0.4); }

        #auth-section { margin: auto; background: #1f2937; padding: 25px; border-radius: 16px; width: 90%; max-width: 380px; border: 1px solid #374151; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        .auth-tabs { display: flex; margin-bottom: 15px; background: #111827; border-radius: 8px; padding: 4px; }
        .auth-tab { flex: 1; background: transparent; color: #9ca3af; padding: 10px; border-radius: 6px; font-size: 0.9rem; }
        .auth-tab.active { background: #4f46e5; color: #fff; }

        input { width: 100%; padding: 8px; margin-bottom: 6px; border-radius: 6px; border: 1px solid #4b5563; background: #374151; color: #fff; font-size: 0.85rem; }
        #game-status { font-weight: 700; min-height: 16px; font-size: 0.8rem; margin: 6px 0 0 0; }
        
        .action-row { display: flex; gap: 6px; margin-bottom: 6px; }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <!-- AUTH SECTION -->
        <div id="auth-section">
            <h2 style="margin-bottom: 6px; color: #f59e0b; font-size: 1.6rem;">✈️ Aviator Game</h2>
            <p style="color:#9ca3af; font-size:0.85rem; margin-bottom: 15px;">Play & Fly High safely!</p>
            
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Login</button>
                <button class="auth-tab" id="tab-signup" onclick="switchAuthTab('signup')">Sign Up</button>
            </div>

            <input type="tel" id="phone" placeholder="Phone Number (10 digits)" maxlength="10">
            <input type="password" id="password" placeholder="Account Password">
            <button class="btn-primary" id="auth-btn" onclick="handleAuth()">Login to Account</button>
        </div>

        <!-- MAIN GAME DASHBOARD -->
        <div id="game-section" class="hidden" style="display:flex; flex-direction:column; width:100%; height:100%;">
            <div id="game-canvas-container">
                <div id="multiplier-overlay">1.00X</div>
                <canvas id="pixi-canvas"></canvas>
            </div>

            <div id="ui-overlay">
                <!-- TOP HUD & SWITCH MODE ROW -->
                <div class="hud-row card">
                    <div style="text-align: left;">
                        <div style="color: #9ca3af; font-size: 0.65rem;">Wallet Balance</div>
                        <div style="font-size: 1.1rem; font-weight: 800;">₹<span id="balance-display">10000</span></div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span id="mode-display" style="background: #374151; padding: 3px 8px; border-radius: 4px; color: #60a5fa; font-size: 0.7rem; font-weight: 700;">DEMO</span>
                        <button class="btn-secondary" onclick="switchMode()">Switch Mode</button>
                    </div>
                </div>
                
                <!-- REAL-MODE ONLY ACTION ROW (Deposit & Withdraw) -->
                <div id="real-actions-container" class="action-row hidden">
                     <button id="deposit-toggle-btn" class="btn-secondary" style="flex:1;" onclick="togglePanel('deposit-panel')">Deposit (₹100)</button>
                     <button id="withdraw-toggle-btn" class="btn-secondary" style="flex:1;" onclick="togglePanel('withdraw-panel')">Withdraw</button>
                </div>

                <!-- DEPOSIT PANEL (Scanner Only, No UPI ID text, Preset ₹100) -->
                <div id="deposit-panel" class="card hidden" style="border: 1px dashed #10b981; text-align: center;">
                    <h4 style="margin: 0 0 4px 0; color: #10b981; font-size:0.75rem;">Scan & Pay ₹100 via UPI</h4>
                    <div style="background:#fff; padding:4px; display:inline-block; border-radius:6px; margin: 2px 0;">
                        <img id="qr-code-img" alt="UPI QR" style="width:90px; height:90px; display:block;" />
                    </div>
                    <button class="btn-deposit-action" onclick="verifyAndCreditDeposit()">Verify & Add ₹100</button>
                </div>

                <!-- WITHDRAW PANEL (Real Mode Only) -->
                <div id="withdraw-panel" class="card hidden" style="border: 1px dashed #ef4444;">
                    <h4 style="margin: 0 0 4px 0; color: #ef4444; font-size:0.8rem;">Withdraw Funds (Min ₹100)</h4>
                    <input type="number" id="withdraw-amt" placeholder="Enter amount (Min 100)">
                    <button class="btn-withdraw" onclick="requestWithdrawal()">Submit Request</button>
                </div>

                <!-- BET CONTROLS SECTION -->
                <div class="card" style="margin-top: auto;">
                    <div class="bet-controls">
                        <button class="bet-btn" onclick="placeBet(30)">₹30</button>
                        <button class="bet-btn" onclick="placeBet(60)">₹60</button>
                        <button class="bet-btn" onclick="placeBet(90)">₹90</button>
                    </div>
                    <p id="game-status" style="color:#f39c12;"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isDemoMode = true;
        let demoBalance = 10000;
        let realBalance = 0;
        let isGameRunning = false;
        let authMode = 'login';
        const MERCHANT_UPI_VPA = "9685008188-4@ybl"; 

        function switchAuthTab(mode) {
            authMode = mode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
            document.getElementById('auth-btn').innerText = mode === 'login' ? "Login to Account" : "Create Account & Sign Up";
        }

        function handleAuth() {
            const phone = document.getElementById('phone').value;
            const pass = document.getElementById('password').value;
            if(phone.length === 10 && pass.length > 0) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('game-section').classList.remove('hidden');
                initPixiGraphics();
                updateUI();
            } else {
                alert("Please enter a valid 10-digit phone number and password.");
            }
        }

        function updateUI() {
            document.getElementById('balance-display').innerText = isDemoMode ? demoBalance : realBalance;
            const modeEl = document.getElementById('mode-display');
            const realActionsEl = document.getElementById('real-actions-container');

            if (isDemoMode) {
                modeEl.innerText = "DEMO";
                modeEl.style.color = "#60a5fa";
                realActionsEl.classList.add('hidden');
                document.getElementById('deposit-panel').classList.add('hidden');
                document.getElementById('withdraw-panel').classList.add('hidden');
            } else {
                modeEl.innerText = "REAL";
                modeEl.style.color = "#10b981";
                realActionsEl.classList.remove('hidden');
            }
        }

        function switchMode() {
            if(isGameRunning) return;
            isDemoMode = !isDemoMode;
            updateUI();
        }

        function togglePanel(panelId) {
            if(isGameRunning || isDemoMode) return;
            const isDepHidden = document.getElementById('deposit-panel').classList.contains('hidden');
            const isWdHidden = document.getElementById('withdraw-panel').classList.contains('hidden');
            
            document.getElementById('deposit-panel').classList.add('hidden');
            document.getElementById('withdraw-panel').classList.add('hidden');
            
            if(panelId === 'deposit-panel' && isDepHidden) {
                document.getElementById('deposit-panel').classList.remove('hidden');
                const upiDeepLink = `upi://pay?pa=${MERCHANT_UPI_VPA}&pn=AviatorGaming&am=100&cu=INR`;
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(upiDeepLink)}`;
                document.getElementById('qr-code-img').src = qrUrl;
            } else if(panelId === 'withdraw-panel' && isWdHidden) {
                document.getElementById('withdraw-panel').classList.remove('hidden');
            }
        }

        function verifyAndCreditDeposit() {
            // Strict enforcement: Show payment error and never add money
            alert("Please pay ₹100 first, payment did not complete!");
        }

        function requestWithdrawal() {
            const amt = parseInt(document.getElementById('withdraw-amt').value);
            if(isNaN(amt) || amt < 100) {
                alert("Minimum withdrawal amount is ₹100!");
                return;
            }
            if(amt > realBalance) {
                alert("Insufficient real wallet balance!");
                return;
            }
            realBalance -= amt;
            updateUI();
            alert("Your withdrawal request has been submitted successfully and will be processed soon.");
            togglePanel('');
        }

        // --- PixiJS 2D Engine with Tiny Clouds & Fleet of Mini Airplanes ---
        let app, mainPlaneSprite, skyContainer, tinyClouds = [], miniAirplanes = [];

        function initPixiGraphics() {
            const container = document.getElementById('game-canvas-container');
            app = new PIXI.Application({
                view: document.getElementById('pixi-canvas'),
                width: container.clientWidth,
                height: container.clientHeight,
                backgroundColor: 0x020617,
                resolution: window.devicePixelRatio || 1
            });

            skyContainer = new PIXI.Container();
            app.stage.addChild(skyContainer);

            const bg = new PIXI.Graphics();
            bg.beginFill(0x0c4a6e);
            bg.drawRect(0, 0, app.screen.width, app.screen.height);
            bg.endFill();
            skyContainer.addChild(bg);

            // Generate 120 tiny clouds
            for(let i=0; i<120; i++) {
                createTinyCloud(Math.random() * app.screen.width * 2, Math.random() * app.screen.height);
            }

            // Generate 100+ tiny mini airplanes flying across the sky
            for(let i=0; i<110; i++) {
                createMiniAirplane(Math.random() * app.screen.width * 2, Math.random() * app.screen.height);
            }

            // Main gameplay aeroplane
            const planeGfx = new PIXI.Graphics();
            planeGfx.beginFill(0xfcd34d); 
            planeGfx.drawRoundedRect(-20, -6, 45, 12, 4);
            planeGfx.endFill();
            planeGfx.beginFill(0xe0e7ff);
            planeGfx.moveTo(-4, -2); planeGfx.lineTo(8, -20); planeGfx.lineTo(16, -2);
            planeGfx.moveTo(-4, 2); planeGfx.lineTo(8, 20); planeGfx.lineTo(16, 2);
            planeGfx.endFill();
            planeGfx.beginFill(0xef4444);
            planeGfx.moveTo(-18, -6); planeGfx.lineTo(-26, -16); planeGfx.lineTo(-10, -6);
            planeGfx.endFill();

            mainPlaneSprite = new PIXI.Container();
            mainPlaneSprite.addChild(planeGfx);
            skyContainer.addChild(mainPlaneSprite);
            resetPlanePosition();
        }

        function createTinyCloud(x, y) {
            const cloud = new PIXI.Graphics();
            cloud.beginFill(0xffffff, 0.2);
            cloud.drawCircle(0, 0, 4);
            cloud.drawCircle(5, -3, 6);
            cloud.drawCircle(10, 0, 4);
            cloud.endFill();
            cloud.x = x;
            cloud.y = y;
            skyContainer.addChild(cloud);
            tinyClouds.push(cloud);
        }

        function createMiniAirplane(x, y) {
            const mini = new PIXI.Graphics();
            mini.beginFill(0x38bdf8, 0.5);
            mini.drawRoundedRect(-6, -2, 14, 4, 1);
            mini.endFill();
            mini.beginFill(0xe2e8f0, 0.6);
            mini.moveTo(-1, -1); mini.lineTo(2, -8); mini.lineTo(5, -1);
            mini.endFill();
            mini.x = x;
            mini.y = y;
            skyContainer.addChild(mini);
            miniAirplanes.push(mini);
        }

        function resetPlanePosition() {
            if(!mainPlaneSprite) return;
            mainPlaneSprite.x = 50;
            mainPlaneSprite.y = app.screen.height - 20;
            mainPlaneSprite.rotation = -0.15;
        }

        function placeBet(betAmount) {
            if(isGameRunning) return;
            let activeBal = isDemoMode ? demoBalance : realBalance;
            if(activeBal < betAmount) {
                alert("Insufficient balance!");
                return;
            }

            if(isDemoMode) demoBalance -= betAmount;
            else realBalance -= betAmount;
            updateUI();

            isGameRunning = true;
            resetPlanePosition();
            let statusEl = document.getElementById('game-status');
            let multiEl = document.getElementById('multiplier-overlay');
            statusEl.style.color = "#f39c12";
            statusEl.innerText = "✈️ Taking off...";

            let currentMultiplier = 1.0;
            let randomRoll = Math.random();
            let targetCrashPoint;
            if (randomRoll < 0.35) {
                targetCrashPoint = parseFloat((1.01 + Math.random() * 0.25).toFixed(2));
            } else {
                targetCrashPoint = parseFloat((1.35 + Math.random() * 2.5).toFixed(2));
            }

            let gameInterval = setInterval(() => {
                // Animate tiny clouds
                tinyClouds.forEach(c => {
                    c.x -= 2.5;
                    if(c.x < -20) c.x = app.screen.width + 20;
                });

                // Animate mini airplanes fleet
                miniAirplanes.forEach(m => {
                    m.x -= 3.0;
                    if(m.x < -30) {
                        m.x = app.screen.width + 30;
                        m.y = Math.random() * app.screen.height;
                    }
                });

                currentMultiplier = (parseFloat(currentMultiplier) + 0.08).toFixed(2);

                if (currentMultiplier >= targetCrashPoint) {
                    clearInterval(gameInterval);
                    isGameRunning = false;
                    
                    mainPlaneSprite.y += 8;
                    mainPlaneSprite.rotation = 0.4;
                    statusEl.style.color = "#ef4444";
                    statusEl.innerText = `💥 Crashed at ${targetCrashPoint}X! You lost ₹${betAmount}.`;
                    multiEl.innerText = targetCrashPoint + "X";
                    updateUI();
                } else {
                    if(mainPlaneSprite.y > 20) mainPlaneSprite.y -= 1.2;
                    
                    if (currentMultiplier >= (targetCrashPoint - 0.4) && Math.random() < 0.4) {
                        clearInterval(gameInterval);
                        isGameRunning = false;
                        let payout = Math.floor(betAmount * currentMultiplier);
                        
                        if(isDemoMode) demoBalance += payout;
                        else realBalance += payout;

                        statusEl.style.color = "#10b981";
                        statusEl.innerText = `✨ Cashed out! Won ₹${payout} at ${currentMultiplier}X!`;
                        multiEl.innerText = currentMultiplier + "X";
                        updateUI();
                        return;
                    }
                    multiEl.innerText = currentMultiplier + "X";
                }
            }, 200);
        }
    </script>
</body>
</html>
