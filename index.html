<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Sky Crash</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap');
        
        * { box-sizing: border-box; }
        html, body { 
            font-family: 'Poppins', sans-serif; 
            background: #0f172a; 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: 0; 
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }

        .hidden { display: none !important; }

        #app-wrapper {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
        }

        #game-canvas-container {
            width: 100%;
            height: 24vh;
            position: relative;
            background: #020617;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            flex-shrink: 0;
        }

        #multiplier-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            pointer-events: none;
            text-shadow: 0 4px 12px rgba(0,0,0,0.9), 0 0 25px rgba(255,215,0,0.6);
            z-index: 10;
        }

        #ui-overlay {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 6px 10px;
            background: #111827;
            border-top: 2px solid #374151;
            overflow-y: auto;
            width: 100%;
            max-height: calc(76vh - env(safe-area-inset-bottom));
        }

        .card { 
            background: #1f2937; 
            padding: 5px 8px; 
            border-radius: 8px; 
            margin-bottom: 4px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.3); 
        }
        
        .hud-row { display: flex; justify-content: space-between; align-items: center; }

        button { 
            border-radius: 8px; 
            border: none; 
            font-weight: 800; 
            cursor: pointer; 
            font-family: 'Poppins', sans-serif; 
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        button:active { transform: scale(0.96); }

        .btn-primary { background: #f59e0b; color: #111; width: 100%; font-size: 1rem; padding: 12px; }
        .btn-secondary { background: #4f46e5; color: #fff; font-size: 0.7rem; padding: 5px 8px; }
        .btn-deposit-action { background: #10b981; color: #fff; width: 100%; font-size: 0.8rem; padding: 6px; margin-top: 2px; }
        .btn-withdraw { background: #ef4444; color: #fff; width: 100%; font-size: 0.8rem; padding: 6px; margin-top: 2px; }
        
        .bet-controls { display: flex; justify-content: center; gap: 6px; }
        .bet-btn { background: #3b82f6; color: white; width: 32%; font-size: 0.9rem; padding: 8px 0; border-radius: 8px; box-shadow: 0 3px 10px rgba(59, 130, 246, 0.4); }

        #auth-section { margin: auto; background: #1f2937; padding: 25px; border-radius: 16px; width: 90%; max-width: 380px; border: 1px solid #374151; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        .auth-tabs { display: flex; margin-bottom: 15px; background: #111827; border-radius: 8px; padding: 4px; }
        .auth-tab { flex: 1; background: transparent; color: #9ca3af; padding: 10px; border-radius: 6px; font-size: 0.9rem; }
        .auth-tab.active { background: #4f46e5; color: #fff; }

        input { width: 100%; padding: 6px; margin-bottom: 4px; border-radius: 6px; border: 1px solid #4b5563; background: #374151; color: #fff; font-size: 0.8rem; }
        #game-status { font-weight: 700; min-height: 14px; font-size: 0.75rem; margin: 2px 0 0 0; }
        
        .action-row { display: flex; gap: 6px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <!-- AUTH SECTION -->
        <div id="auth-section">
            <h2 style="margin-bottom: 6px; color: #f59e0b; font-size: 1.6rem;">✈️ Aviator Game</h2>
            <p style="color:#9ca3af; font-size:0.85rem; margin-bottom: 15px;">Play & Fly High safely!</p>
            
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Login</button>
                <button class="auth-tab" id="tab-signup" onclick="switchAuthTab('signup')">Sign Up</button>
            </div>

            <input type="tel" id="phone" placeholder="Phone Number (10 digits)" maxlength="10">
            <input type="password" id="password" placeholder="Account Password">
            <button class="btn-primary" id="auth-btn" onclick="handleAuth()">Login to Account</button>
        </div>

        <!-- MAIN GAME DASHBOARD -->
        <div id="game-section" class="hidden" style="display:flex; flex-direction:column; width:100%; height:100%;">
            <div id="game-canvas-container">
                <div id="multiplier-overlay">1.00X</div>
                <canvas id="pixi-canvas"></canvas>
            </div>

            <div id="ui-overlay">
                <!-- TOP HUD & SWITCH MODE ROW -->
                <div class="hud-row card" style="padding: 5px 8px;">
                    <div style="text-align: left;">
                        <div style="color: #9ca3af; font-size: 0.55rem;">Wallet Balance</div>
                        <div style="font-size: 0.95rem; font-weight: 800;">₹<span id="balance-display">10000</span></div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span id="mode-display" style="background: #374151; padding: 2px 5px; border-radius: 4px; color: #60a5fa; font-size: 0.6rem; font-weight: 700;">DEMO</span>
                        <button class="btn-secondary" onclick="switchMode()">Switch Mode</button>
                    </div>
                </div>
                
                <div class="action-row">
                     <button id="deposit-toggle-btn" class="btn-secondary hidden" style="flex:1;" onclick="togglePanel('deposit-panel')">Deposit (₹200)</button>
                     <button id="withdraw-toggle-btn" class="btn-secondary hidden" style="flex:1;" onclick="togglePanel('withdraw-panel')">Withdraw</button>
                </div>

                <!-- DEPOSIT PANEL WITH QR SCANNER & UTR VERIFICATION -->
                <div id="deposit-panel" class="card hidden" style="border: 1px dashed #10b981; text-align: center;">
                    <h4 style="margin: 0 0 2px 0; color: #10b981; font-size:0.7rem;">Scan & Pay via QR Code (₹200)</h4>
                    <p style="font-size:0.55rem; color:#9ca3af; margin:0 0 3px 0;">Scan with PhonePe, GPay, or Paytm:</p>
                    
                    <div style="background:#fff; padding:3px; display:inline-block; border-radius:6px; margin: 2px 0;">
                        <img id="qr-code-img" alt="UPI QR" style="width:85px; height:85px; display:block;" />
                    </div>

                    <div style="font-size:0.6rem; color:#f59e0b; margin: 2px 0;">
                        UPI ID: <b>9685008188-4@ybl</b>
                    </div>

                    <div style="margin: 3px 0;">
                        <input type="text" id="utr-input" placeholder="Enter 12-digit UPI UTR No." maxlength="12" style="text-align: center; font-weight: 700; padding: 4px; font-size: 0.7rem;">
                    </div>

                    <button class="btn-deposit-action" onclick="verifyAndCreditDeposit()">Verify & Add ₹200</button>
                </div>

                <!-- WITHDRAW PANEL -->
                <div id="withdraw-panel" class="card hidden" style="border: 1px dashed #ef4444;">
                    <h4 style="margin: 0 0 2px 0; color: #ef4444; font-size:0.7rem;">Withdraw Funds (Min ₹500)</h4>
                    <input type="number" id="withdraw-amt" placeholder="Enter amount (Min 500)" style="margin-bottom:2px; padding:4px; font-size:0.7rem;">
                    <button class="btn-withdraw" onclick="requestWithdrawal()">Submit Request</button>
                </div>

                <!-- BET CONTROLS SECTION -->
                <div class="card" style="margin-top: auto; margin-bottom: 2px;">
                    <div class="bet-controls">
                        <button class="bet-btn" onclick="placeBet(30)">₹30</button>
                        <button class="bet-btn" onclick="placeBet(60)">₹60</button>
                        <button class="bet-btn" onclick="placeBet(90)">₹90</button>
                    </div>
                    <p id="game-status" style="color:#f39c12;"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isDemoMode = true;
        let demoBalance = 10000;
        let realBalance = 0;
        let isGameRunning = false;
        let authMode = 'login';

        const MERCHANT_UPI_VPA = "9685008188-4@ybl"; 
        let usedUtRs = new Set();

        function switchAuthTab(mode) {
            authMode = mode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
            document.getElementById('auth-btn').innerText = mode === 'login' ? "Login to Account" : "Create Account & Sign Up";
        }

        function handleAuth() {
            const phone = document.getElementById('phone').value;
            const pass = document.getElementById('password').value;
            if(phone.length === 10 && pass.length > 0) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('game-section').classList.remove('hidden');
                initPixiGraphics();
                updateUI();
            } else {
                alert("Please enter a valid 10-digit phone number and password.");
            }
        }

        function updateUI() {
            document.getElementById('balance-display').innerText = isDemoMode ? demoBalance : realBalance;
            const modeEl = document.getElementById('mode-display');
            const depBtn = document.getElementById('deposit-toggle-btn');
            const wdBtn = document.getElementById('withdraw-toggle-btn');

            if (isDemoMode) {
                modeEl.innerText = "DEMO";
                modeEl.style.color = "#60a5fa";
                depBtn.classList.add('hidden');
                wdBtn.classList.add('hidden');
                document.getElementById('deposit-panel').classList.add('hidden');
                document.getElementById('withdraw-panel').classList.add('hidden');
            } else {
                modeEl.innerText = "REAL";
                modeEl.style.color = "#10b981";
                depBtn.classList.remove('hidden');
                wdBtn.classList.remove('hidden');
            }
        }

        function switchMode() {
            if(isGameRunning) return;
            isDemoMode = !isDemoMode;
            updateUI();
        }

        function togglePanel(panelId) {
            if(isGameRunning) return;
            const isDepHidden = document.getElementById('deposit-panel').classList.contains('hidden');
            const isWdHidden = document.getElementById('withdraw-panel').classList.contains('hidden');
            
            document.getElementById('deposit-panel').classList.add('hidden');
            document.getElementById('withdraw-panel').classList.add('hidden');
            
            if(panelId === 'deposit-panel' && isDepHidden) {
                document.getElementById('deposit-panel').classList.remove('hidden');
                const upiDeepLink = `upi://pay?pa=${MERCHANT_UPI_VPA}&pn=AviatorGaming&am=200&cu=INR`;
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(upiDeepLink)}`;
                document.getElementById('qr-code-img').src = qrUrl;
            } else if(panelId === 'withdraw-panel' && isWdHidden) {
                document.getElementById('withdraw-panel').classList.remove('hidden');
            }
        }

        function verifyAndCreditDeposit() {
            const utr = document.getElementById('utr-input').value.trim();
            
            if (utr.length !== 12 || isNaN(utr)) {
                alert("Please enter a valid 12-digit UPI Reference Number (UTR) from your payment app receipt.");
                return;
            }

            if (usedUtRs.has(utr)) {
                alert("This transaction reference number has already been used!");
                return;
            }

            usedUtRs.add(utr);
            let fixedDepositAmt = 200;
            realBalance += fixedDepositAmt;
            updateUI();
            
            alert(`Payment of ₹${fixedDepositAmt} verified successfully! Added to your wallet balance.`);
            document.getElementById('utr-input').value = '';
            togglePanel('');
        }

        function requestWithdrawal() {
            const amt = parseInt(document.getElementById('withdraw-amt').value);
            if(isNaN(amt) || amt < 500) {
                alert("Minimum withdrawal amount is ₹500!");
                return;
            }
            if(amt > realBalance) {
                alert("Insufficient real wallet balance!");
                return;
            }
            realBalance -= amt;
            updateUI();
            alert("Your withdrawal request has been submitted successfully. It will be processed within 24 hours.");
            togglePanel('');
        }

        // --- PixiJS 2D Engine ---
        let app, planeSprite, skyContainer, clouds = [];

        function initPixiGraphics() {
            const container = document.getElementById('game-canvas-container');
            app = new PIXI.Application({
                view: document.getElementById('pixi-canvas'),
                width: container.clientWidth,
                height: container.clientHeight,
                backgroundColor: 0x020617,
                resolution: window.devicePixelRatio || 1
            });

            skyContainer = new PIXI.Container();
            app.stage.addChild(skyContainer);

            const bg = new PIXI.Graphics();
            bg.beginFill(0x0c4a6e);
            bg.drawRect(0, 0, app.screen.width, app.screen.height);
            bg.endFill();
            skyContainer.addChild(bg);

            for(let i=0; i<3; i++) {
                createCloud(Math.random() * app.screen.width, Math.random() * app.screen.height);
            }

            const planeGfx = new PIXI.Graphics();
            planeGfx.beginFill(0xfcd34d); 
            planeGfx.drawRoundedRect(-20, -6, 45, 12, 4);
            planeGfx.endFill();
            planeGfx.beginFill(0xe0e7ff);
            planeGfx.moveTo(-4, -2); planeGfx.lineTo(8, -20); planeGfx.lineTo(16, -2);
            planeGfx.moveTo(-4, 2); planeGfx.lineTo(8, 20); planeGfx.lineTo(16, 2);
            planeGfx.endFill();
            planeGfx.beginFill(0xef4444);
            planeGfx.moveTo(-18, -6); planeGfx.lineTo(-26, -16); planeGfx.lineTo(-10, -6);
            planeGfx.endFill();

            planeSprite = new PIXI.Container();
            planeSprite.addChild(planeGfx);
            skyContainer.addChild(planeSprite);
            resetPlanePosition();
        }

        function createCloud(x, y) {
            const cloud = new PIXI.Graphics();
            cloud.beginFill(0xffffff, 0.25);
            cloud.drawCircle(0, 0, 12);
            cloud.drawCircle(10, -6, 16);
            cloud.drawCircle(22, 0, 12);
            cloud.endFill();
            cloud.x = x;
            cloud.y = y;
            skyContainer.addChild(cloud);
            clouds.push(cloud);
        }

        function resetPlanePosition() {
            if(!planeSprite) return;
            planeSprite.x = 40;
            planeSprite.y = app.screen.height - 15;
            planeSprite.rotation = -0.15;
        }

        function placeBet(betAmount) {
            if(isGameRunning) return;
            let activeBal = isDemoMode ? demoBalance : realBalance;
            if(activeBal < betAmount) {
                alert("Insufficient balance!");
                return;
            }

            if(isDemoMode) demoBalance -= betAmount;
            else realBalance -= betAmount;
            updateUI();

            isGameRunning = true;
            resetPlanePosition();
            let statusEl = document.getElementById('game-status');
            let multiEl = document.getElementById('multiplier-overlay');
            statusEl.style.color = "#f39c12";
            statusEl.innerText = "✈️ Taking off...";

            let currentMultiplier = 1.0;
            let randomRoll = Math.random();
            let targetCrashPoint;
            if (randomRoll < 0.35) {
                targetCrashPoint = parseFloat((1.01 + Math.random() * 0.25).toFixed(2));
            } else {
                targetCrashPoint = parseFloat((1.35 + Math.random() * 2.2).toFixed(2));
            }

            let gameInterval = setInterval(() => {
                clouds.forEach(c => {
                    c.x -= 1.5;
                    if(c.x < -40) c.x = app.screen.width + 40;
                });

                currentMultiplier = (parseFloat(currentMultiplier) + 0.08).toFixed(2);

                if (currentMultiplier >= targetCrashPoint) {
                    clearInterval(gameInterval);
                    isGameRunning = false;
                    
                    planeSprite.y += 6;
                    planeSprite.rotation = 0.4;
                    statusEl.style.color = "#ef4444";
                    statusEl.innerText = `💥 Crashed at -${targetCrashPoint}X! You lost ₹${betAmount}.`;
                    multiEl.innerText = "-" + targetCrashPoint + "X";
                    updateUI();
                } else {
                    if(planeSprite.y > 15) planeSprite.y -= 1;
                    
                    if (currentMultiplier >= (targetCrashPoint - 0.4) && Math.random() < 0.4) {
                        clearInterval(gameInterval);
                        isGameRunning = false;
                        let payout = Math.floor(betAmount * currentMultiplier);
                        
                        if(isDemoMode) demoBalance += payout;
                        else realBalance += payout;

                        statusEl.style.color = "#10b981";
                        statusEl.innerText = `✨ Cashed out! Won ₹${payout} at ${currentMultiplier}X!`;
                        multiEl.innerText = currentMultiplier + "X";
                        updateUI();
                        return;
                    }
                    multiEl.innerText = currentMultiplier + "X";
                }
            }, 200);
        }
    </script>
</body>
</html>
